# Configuração do Firebase App Hosting (Next.js sobre Cloud Run)
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_USAR_EMULADORES
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-ENHD6E997Z"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_URL_BASE_PUBLICA
    value: "https://nexoativo.com.br"
    availability:
      - BUILD
      - RUNTIME
