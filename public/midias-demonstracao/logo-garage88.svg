<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" role="img" aria-label="Garage 88">
  <defs>
    <linearGradient id="g88-vermelho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="g88-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="g88-escudo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Emblema Automotivo / Escudo 88 -->
  <g transform="translate(4, 4)">
    <!-- Moldura chanfrada externa -->
    <path d="M 12 2 L 44 2 L 54 18 L 44 54 L 12 54 L 2 18 Z" fill="url(#g88-escudo)" stroke="#334155" stroke-width="2" />
    <!-- Detalhe esportivo lateral vermelho -->
    <path d="M 44 2 L 54 18 L 44 54" stroke="url(#g88-vermelho)" stroke-width="3" stroke-linecap="round" />
    <!-- Numeral 88 estilizado em alta velocidade -->
    <text x="28" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="28" fill="url(#g88-metal)" text-anchor="middle" letter-spacing="-1">88</text>
  </g>

  <!-- Tipografia da Marca -->
  <!-- Palavra GARAGE -->
  <text x="72" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="url(#g88-metal)" letter-spacing="4">GARAGE</text>
  
  <!-- Destaque 88 no texto -->
  <text x="214" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="24" fill="url(#g88-vermelho)">88</text>

  <!-- Linha divisória dinâmica -->
  <line x1="72" y1="40" x2="256" y2="40" stroke="#334155" stroke-width="1.5" />
  <line x1="72" y1="40" x2="120" y2="40" stroke="url(#g88-vermelho)" stroke-width="2" />

  <!-- Subtítulo de posicionamento -->
  <text x="73" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5" fill="#94A3B8" letter-spacing="2.8">SEMINOVOS · CABO FRIO</text>
</svg>

